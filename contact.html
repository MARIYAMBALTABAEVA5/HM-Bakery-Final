    <h1>Contact us</h1><section class="hero"><img src="images/bakery-display.jpg" alt="Bakery display"><div><p>12 Baker Street, Astana, Kazakhstan</p><p>+7 (700) 000-00-00</p><p>hello@hmbakery.example</p><p>Demo contact details</p></div></section><h2>Send a message</h2><form id="contact" novalidate><label>Full name<input name="name" type="text"><span class="error" data-error="name"></span></label><label>Email<input name="email" type="text"><span class="error" data-error="email"></span></label><label>Phone number<input name="phone" type="tel"><span class="error" data-error="phone"></span></label><label>Message<textarea name="message"></textarea><span class="error" data-error="message"></span></label><p class="feedback" role="status"></p><button>Send message</button></form><h2 id="signup">Sign up</h2><form id="signup-form" novalidate><label>Full name<input name="name" type="text"><span class="error" data-error="name"></span></label><label>Email<input name="email" type="text"><span class="error" data-error="email"></span></label><label>Phone number<input name="phone" type="tel"><span class="error" data-error="phone"></span></label><label>Password<input name="password" type="password"><span class="error" data-error="password"></span></label><p class="feedback" role="status"></p><button type="submit">Create account</button></form>
